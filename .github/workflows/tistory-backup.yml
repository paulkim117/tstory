name: Tistory Public Post Backup

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if grep -Eq '^[[:space:]]*[^#[:space:]]' requirements.txt; then
            python -m pip install -r requirements.txt
          else
            echo "No external dependencies."
          fi

      - name: Run Tistory backup
        run: python scripts/backup_tistory.py

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain posts schemas metadata logs)" ]; then
            echo "No Tistory backup changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts schemas metadata logs
          git commit -m "Backup Tistory posts - $(date -u +'%Y-%m-%d')"
          git push
