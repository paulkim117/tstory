<p>3월의 조정장은 유독 길고 많이 아픈 조정장이였다.</p>
<p>1월에 +500만원 까지 보고 있다가 한순간에 실현 손익이 +70만원으로 보니깐 진짜 멘탈이 바사삭 망가졌네</p>
<p>아무튼 주식장은 운이 좋아서 많이 벌었고 남들 벌면 너무 배아파 따라가다가 물려본적도 많아&nbsp;</p>
<p>주식은 심리게임이라는 것이 확실하다.</p>
<p>물려있는 주식들이 다 탈출하면 좋겠지만 남은 예수금을 투자할 계획은 없다.</p>
<p>남은 예수금으로는 짧게 단타 실력이나 시장 흐름 판단하려고 사용할 계획이다.</p>
